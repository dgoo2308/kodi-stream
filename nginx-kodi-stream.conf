# kodi-stream — box-side nginx site. Reached only through the frp tunnel (subdomain "stream",
# local 127.0.0.1:8088); auth + TLS live on the VPS (stream.nellika.io).
server {
    listen 127.0.0.1:8088;
    server_name _;
    root /opt/kodi-stream/static;
    index index.html;

    access_log /var/log/nginx/kodi-stream.access.log;
    error_log  /var/log/nginx/kodi-stream.error.log;

    # static page + vendored hls.js
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # rolling HLS window of the live session (tiny, changes every few seconds: never cache)
    location /hls/ {
        alias /home/pi/kodi-stream-run/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; text/vtt vtt; }
        add_header Cache-Control "no-store";
    }

    # JSON API (stdlib Python)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # direct play: the API answers with X-Accel-Redirect: /media/<relative path>
    location /media/ {
        internal;
        alias /var/media/lacie/Media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }
}
