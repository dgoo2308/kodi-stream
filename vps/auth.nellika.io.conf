# auth.nellika.io: Nellika sign-in (nellika-auth, 127.0.0.1:8091) - passkeys, invites, devices, people.
# The service itself decides what needs a sign-in; every path goes to it.
server {
    listen 443 ssl http2;
    server_name auth.nellika.io;

    ssl_certificate /etc/letsencrypt/live/nellika.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nellika.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/auth.access.log;
    error_log /var/log/nginx/auth.error.log;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name auth.nellika.io;
    return 301 https://auth.nellika.io$request_uri;
}
