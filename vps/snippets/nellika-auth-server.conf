# Nellika sign-in for an app vhost behind nell_remote: include at SERVER level, together with
# nellika-auth-location.conf inside every protected location. See vps/README-nellika-auth.md.
#   server { ...  include snippets/nellika-auth-server.conf;
#            location / { include snippets/nellika-auth-location.conf; proxy_pass ...; } }

# session check for auth_request (answers 200 + X-Auth-* headers, or 401)
location = /_authcheck {
    internal;
    proxy_pass http://127.0.0.1:8091/_authcheck;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# callback (single-use code -> this app's own cookie), logout, /_auth/me
location ^~ /_auth/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# signed out: the service sends the browser to auth.nellika.io/authorize?rd=<this url, encoded>
location @nellika_signin {
    # (a named location cannot proxy_pass to a path: rewrite first; X-Original-URI keeps the real one)
    rewrite ^ /_auth/start break;
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}
