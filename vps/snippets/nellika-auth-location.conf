# Nellika sign-in: include inside each protected location (needs nellika-auth-server.conf in the server).
# Signed-out visitors go to auth.nellika.io; signed-in requests reach the app with trusted identity
# headers (any client-sent X-Auth-* is overwritten here). The app decides what that person may do:
#   X-Auth-User   account name (lowercase, [a-z0-9._-])
#   X-Auth-Name   display name, URL-encoded UTF-8
#   X-Auth-Admin  "1" for Nellika admins (people management), "0" otherwise
auth_request /_authcheck;
auth_request_set $nauth_user $upstream_http_x_auth_user;
auth_request_set $nauth_name $upstream_http_x_auth_name;
auth_request_set $nauth_admin $upstream_http_x_auth_admin;
proxy_set_header X-Auth-User $nauth_user;
proxy_set_header X-Auth-Name $nauth_name;
proxy_set_header X-Auth-Admin $nauth_admin;
error_page 401 = @nellika_signin;
