# kodi-stream: HLS streaming of the Kodi library (box nginx :8088 via frp subdomain "stream").
# Sign-in: Nellika sign-in (auth.nellika.io, nellika-auth on 127.0.0.1:8091) through the shared
# snippets; the box gets X-Auth-User / X-Auth-Name / X-Auth-Admin and keeps per-person progress.
server {
    listen 443 ssl http2;
    server_name stream.nellika.io;

    ssl_certificate /etc/letsencrypt/live/nellika.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nellika.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    auth_basic off;

    access_log /var/log/nginx/stream.access.log;
    error_log /var/log/nginx/stream.error.log;

    client_max_body_size 1m;

    include snippets/nellika-auth-server.conf;

    # links from before auth.nellika.io (old sign-in / devices / pairing pages): redirected by the service
    location ~ ^/_(login|logout|pair|devices|enroll)$ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        include snippets/nellika-auth-location.conf;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_redirect off;

        # HLS: many small GETs, stream the bytes through, be patient with a busy box
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass http://frp-vhost;
    }
}
