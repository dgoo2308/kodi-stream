# kodi-stream: HLS streaming of the Kodi library (box nginx :8088 via frp subdomain "stream").
# Auth: the stream-auth service (127.0.0.1:8091): passkeys, a stream-only password, and phone (QR)
# sign-in for TVs/tablets, each device a revocable session. No HTTP Basic fallback any more: it used
# the transmission/torrent-add htpasswd, which stream must not share.
server {
    listen 443 ssl http2;
    server_name stream.nellika.io;

    ssl_certificate /etc/letsencrypt/live/nellika.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nellika.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    auth_basic off;

    access_log /var/log/nginx/stream.access.log;
    error_log /var/log/nginx/stream.error.log;

    client_max_body_size 1m;

    # cookie validator for auth_request (no auth itself)
    location = /_authcheck {
        internal;
        proxy_pass http://127.0.0.1:8091/_authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # sign-in pages + passkey / pairing API (public: the service checks the session itself)
    location = /_login   { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /_logout  { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /_pair    { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /_devices { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /_enroll  { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /_auth/  { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location / {
        auth_request /_authcheck;                       # valid session cookie -> allow
        error_page 401 = @login;                        # otherwise -> the sign-in page

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_redirect off;

        # HLS: many small GETs, stream the bytes through, be patient with a busy box
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass http://frp-vhost;
    }

    location @login { return 302 https://$host/_login?next=$request_uri; }
}
