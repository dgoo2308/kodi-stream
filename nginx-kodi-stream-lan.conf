# kodi-stream — LAN site: http://kodi.local (avahi mDNS) for watching at home without the
# VPS/frp round trip. Deliberately a SEPARATE server block: the frp tunnel target
# (nginx-kodi-stream.conf, 127.0.0.1:8088) is left untouched.
# No login here (auth lives on the VPS): the LAN is trusted, everything else is denied.
# IPv4 only — the box has a global IPv6 address, so no [::]:80 listener; browsers that try
# kodi.local's IPv6 first get an instant refusal and fall back to IPv4.
server {
    listen 80;
    server_name kodi.local kodi _;
    root /opt/kodi-stream/static;
    index index.html;

    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;

    access_log /var/log/nginx/kodi-stream-lan.access.log;
    error_log  /var/log/nginx/kodi-stream-lan.error.log;

    # the locations below mirror nginx-kodi-stream.conf — keep the two in step
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /hls/ {
        alias /home/pi/kodi-stream-run/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; text/vtt vtt; }
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /media/ {
        internal;
        alias /var/media/lacie/Media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    location /thumbcache/ {
        internal;
        alias /home/pi/kodi-stream-thumbs/;
    }
}
