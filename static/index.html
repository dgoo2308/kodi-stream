<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodi stream</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --acc:#4da3ff; --card:#1b1b1b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:#000d; backdrop-filter:blur(8px); display:flex; gap:8px; align-items:center; padding:10px 12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 8px 0 0; }
  header input[type=search] { flex:0 1 220px; min-width:0; background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:7px 10px; font-size:15px; }
  .filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .filters select, .filters label, .filters .selbtn { background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:7px 8px; font-size:14px; max-width:170px; }
  .filters label { display:flex; gap:5px; align-items:center; cursor:pointer; white-space:nowrap; }
  .filters.hide { display:none; }
  .tabs { margin-left:auto; display:flex; gap:6px; }
  .tabs button { background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:8px 10px; }
  .tabs .acct { background:#222; border:1px solid #333; border-radius:8px; padding:8px 10px; text-decoration:none; }
  .tabs button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  #more { height:1px; }
  /* phone: tabs + search on row 1, sort/genre/unwatched on row 2 */
  @media (max-width: 640px) {
    header { gap:6px; padding:8px 10px; }
    header h1 { display:none; }
    .tabs { order:1; margin-left:0; }
    header input[type=search] { order:2; flex:1 1 0; }
    .filters { order:3; flex:1 1 100%; flex-wrap:nowrap; min-width:0; }
    .filters select, .filters .selbtn { flex:1 1 0; min-width:0; max-width:none; font-size:14px; padding:7px 8px; }
    .filters label { flex:none; padding:7px 6px; }
  }
  main { padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; }
  .card img { width:100%; aspect-ratio:2/3; object-fit:cover; background:#222; display:block; }
  .card.ep img { aspect-ratio:16/9; }
  .card .t { padding:6px 8px; font-size:13px; line-height:1.25; }
  .card .t small { color:var(--mut); display:block; }
  .card .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--acc); }
  .card .seen { position:absolute; top:6px; right:6px; background:#0a0c; color:#8f8; font-size:11px; padding:2px 6px; border-radius:6px; }
  #player { position:fixed; inset:0; background:#000; z-index:10; display:none; flex-direction:column; }
  #player.on { display:flex; }
  #player video { position:absolute; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }
  #pbar { position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; gap:10px; align-items:center; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top,#000f,#0008 55%,#0000); color:#eee; font-size:13px; flex-wrap:wrap; }
  #pbar { opacity:1; transition:opacity .25s ease; }
  #player.hidebar #pbar { opacity:0; pointer-events:none; }
  #player.hidebar { cursor:none; }
  #pbar button, #pbar select { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:6px 10px; }
  #pbar .pick { max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* TV remotes move focus around: a clear blue ring instead of the browser's default (red on LG) */
  :focus { outline:none; }
  :focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  .card:focus-visible { outline:3px solid var(--acc); outline-offset:3px; transform:scale(1.04); z-index:1; }
  .card { scroll-margin:120px 0 24px; transition:transform .12s ease; }
  /* native <select>s are replaced by buttons that open the picker (#pmenu) */
  select.enh { display:none !important; }
  .selbtn { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px 12px; font-size:15px;
            max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; cursor:pointer; }
  .selbtn::after { content:' ▾'; color:var(--mut); }
  /* on TVs: a coloured dot on the controls the remote's colour buttons trigger */
  html.tv .ck::before { content:''; display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; background:var(--ck); }
  /* TVs whose remote is a pointer (LG Magic Remote): bigger thumbnails = less pointer travel per title,
     and the highlight follows the pointer */
  html.tv .grid { grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:18px; }
  html.tv .card:hover { outline:3px solid var(--acc); outline-offset:3px; transform:scale(1.04); z-index:1; }
  html.tv button:hover, html.tv a:hover, html.tv .selbtn:hover, html.tv label:hover { outline:3px solid var(--acc); outline-offset:2px; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#000d; color:#fff; padding:12px 20px;
           border-radius:10px; font-size:17px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.on { opacity:1; }
  html.tv.wheelnav .card:hover:not(:focus) { outline:none; transform:none; }
  html.tv.wheelnav .card:focus { outline:3px solid var(--acc); outline-offset:3px; transform:scale(1.04); z-index:1; }
  #tvtip { background:#1d2a38; color:#cfe3ff; font-size:15px; padding:8px 14px; }
  .ck-r { --ck:#e53935; } .ck-g { --ck:#43a047; } .ck-y { --ck:#fdd835; } .ck-b { --ck:#1e88e5; }
  /* in-player picker (audio / subtitles / quality): big buttons, works with a TV remote's arrows + OK */
  #pmenu { position:absolute; right:14px; bottom:84px; z-index:3; display:none; flex-direction:column; gap:6px;
           min-width:240px; max-width:min(420px, 92vw); max-height:60vh; overflow:auto; padding:12px;
           background:#141414f2; border:1px solid #333; border-radius:12px; }
  #pmenu.on { display:flex; }
  #pmenu.modal { position:fixed; left:50%; top:50%; right:auto; bottom:auto; transform:translate(-50%,-50%); z-index:40;
                 max-height:70vh; box-shadow:0 0 0 100vmax #0009; }
  /* anchored next to its trigger (wins over the centred .modal placement) */
  #pmenu.anchored, #pmenu.modal.anchored { position:fixed; right:auto; bottom:auto; top:auto; transform:none; z-index:40; }
  #pmenu .ttl { color:var(--mut); font-size:13px; padding:0 4px 4px; }
  #pmenu button { text-align:left; font-size:17px; padding:11px 14px; background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; }
  #pmenu button.cur { border-color:var(--acc); color:var(--acc); }
  #seek { flex:1; min-width:160px; }
  #ptitle { width:100%; color:#fff; font-weight:600; }
  #msg { color:#fc6; }
  #buf { color:var(--mut); }
  a.btn { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px 12px; font-size:15px; text-decoration:none; }
  .dl { grid-column:1/-1; display:flex; flex-direction:column; gap:10px; max-width:720px; }
  .dl .job { background:var(--card); border-radius:10px; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dl .job .name { flex:1 1 220px; min-width:0; }
  .dl .job small { color:var(--mut); display:block; }
  .dl .job .prog { flex:1 1 100%; height:4px; background:#333; border-radius:2px; overflow:hidden; }
  .dl .job .prog div { height:100%; background:var(--acc); }
  .dl .job button { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:6px 10px; }
  #detail { position:fixed; inset:auto 0 0 0; background:#181818; border-top:1px solid #333; padding:14px 16px 24px; z-index:6; display:none; }
  #detail.on { display:block; }
  #detail h2 { margin:0 0 6px; font-size:17px; }
  #detail .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  #detail button, #detail select { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px 12px; font-size:15px; }
  #detail button.primary { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600; }
  #detail .info { color:var(--mut); font-size:13px; }
  .empty { color:var(--mut); padding:30px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Kodi</h1>
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <div class="filters" id="filters">
    <select id="fSort" title="Sort">
      <option value="added">Recently added</option>
      <option value="title">Title A–Z</option>
      <option value="year">Newest release</option>
      <option value="rating">Top rated</option>
      <option value="watched">Recently watched</option>
    </select>
    <select id="fGenre" title="Genre"><option value="">All genres</option></select>
    <label><input type="checkbox" id="fUnw"> Unwatched</label>
  </div>
  <div class="tabs"><button id="tabM" class="on">Movies</button><button id="tabS">Shows</button><button id="tabD" title="Downloads">⬇</button><a id="acct" class="acct" href="/_devices" title="My devices / sign in a TV" style="display:none">👤</a></div>
</header>
<div id="tvtip" style="display:none"></div>
<main><div id="crumb" style="color:var(--mut);margin:0 0 8px;display:none"></div><div id="grid" class="grid"></div><div id="more"></div></main>

<div id="detail">
  <h2 id="dTitle"></h2>
  <div class="info" id="dInfo">…</div>
  <div class="row">
    <label>Audio <select id="dAudio"></select></label>
    <label>Subtitles <select id="dSub"><option value="">Off</option></select></label>
    <label>Quality <select id="dQ"><option value="720p">720p</option><option value="540p">540p</option><option value="360p">360p</option></select></label>
    <label>Encoder <select id="dEnc"><option value="x264">SW (x264)</option><option value="rkmpp">HW (rkmpp)</option></select></label>
  </div>
  <div class="row">
    <button class="primary" id="dResume" style="display:none">Resume</button>
    <button class="primary" id="dPlay">Play from start</button>
    <button id="dClose">Close</button>
    <select id="dStart" style="display:none"></select>
  </div>
  <div class="row">
    <button id="dPrep" title="Encode a phone-friendly MP4 at the chosen quality, then save it from the ⬇ tab">⬇ Prepare MP4</button>
    <a id="dOrig" class="btn" href="#" style="display:none">⬇ Original</a>
    <span class="info" id="dDlMsg"></span>
  </div>
</div>

<div id="player">
  <video id="video" playsinline autoplay></video>
  <div id="pbar">
    <div id="ptitle"></div>
    <button id="bPlay">⏸</button>
    <span id="tcur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="tdur">0:00</span>
    <button id="bBack">−15s</button><button id="bFwd">+30s</button>
    <button id="pAudio" class="pick" title="Audio"></button>
    <button id="pSub" class="pick" title="Subtitles"></button>
    <button id="pQ" class="pick" title="Quality"></button>
    <button id="bFull">⛶</button>
    <button id="bStop">Stop</button>
    <span id="msg"></span>
    <span id="buf"></span>
  </div>
  <div id="pmenu" role="menu"></div>
</div>

<script src="hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('/api' + p, opt).then(r => r.json());
const post = (p, body) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
let tab = 'movie', showId = null, cur = null;
{ const e = new URLSearchParams(location.search).get('enc'); if (e === 'x264' || e === 'rkmpp') setTimeout(() => { $('#dEnc').value = e; syncSel(); }, 0); }

// ---------------- catalogue
function card(it) {
  const d = document.createElement('div');
  d.className = 'card' + (it.type === 'episode' ? ' ep' : '');
  const pct = it.total ? Math.min(100, 100 * (it.resume||0) / it.total) : 0;
  const sub = it.type === 'episode' ? `S${it.season}E${it.episode}`
    : (it.year || '') + ($('#fSort').value === 'rating' && it.rating ? ` · ★${it.rating}` : '');
  d.innerHTML = `<img loading="lazy" src="${it.poster || ''}" alt=""><div class="t">${it.title}<small>${sub}</small></div>` +
    (pct ? `<div class="bar" style="width:${pct}%"></div>` : '') + (it.playCount ? '<div class="seen">✓</div>' : '');
  d.tabIndex = 0; d.dataset.key = it.type + it.id;
  d.onclick = () => it.type === 'show' ? openShow(it) : openItem(it);
  return d;
}
// sort / genre / unwatched, remembered per tab (browser storage may be unavailable: then just defaults)
const PAGE = 120;
let paging = { offset: 0, done: true, busy: false, gen: 0 };
const genreCache = {};
function savePrefs() {
  try { localStorage.setItem('ks.filters.' + tab, JSON.stringify({ sort: $('#fSort').value, genre: $('#fGenre').value, unw: $('#fUnw').checked })); } catch (e) {}
}
async function restorePrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('ks.filters.' + tab) || '{}') || {}; } catch (e) {}
  $('#fSort').value = p.sort || 'added';
  if (!$('#fSort').value) $('#fSort').value = 'added';
  $('#fUnw').checked = !!p.unw;
  const kind = tab === 'movie' ? 'movie' : 'tvshow';
  if (!genreCache[kind]) genreCache[kind] = await api('/genres?type=' + kind).catch(() => []);
  $('#fGenre').innerHTML = '<option value="">All genres</option>' +
    genreCache[kind].map(g => `<option value="${g.name.replace(/"/g, '&quot;')}">${g.name} (${g.count})</option>`).join('');
  $('#fGenre').value = p.genre || '';
  if ($('#fGenre').value !== (p.genre || '')) $('#fGenre').value = '';
  syncSel();
}
async function nextPage() {
  if (paging.done || paging.busy) return;
  paging.busy = true; const gen = paging.gen;
  const params = new URLSearchParams({ q: $('#q').value.trim(), sort: $('#fSort').value, genre: $('#fGenre').value,
                                       unwatched: $('#fUnw').checked ? '1' : '', limit: PAGE, offset: paging.offset });
  const items = await api(`/${tab === 'movie' ? 'movies' : 'shows'}?${params}`).catch(() => []);
  if (gen !== paging.gen) return;  // filters changed while this page was in flight
  const grid = $('#grid');
  if (paging.offset === 0) grid.innerHTML = items.length ? '' : '<div class="empty">Nothing found</div>';
  items.forEach(it => grid.appendChild(card(it)));
  paging.offset += items.length; paging.done = items.length < PAGE; paging.busy = false;
  if (!paging.done && $('#more').getBoundingClientRect().top < innerHeight + 600) return nextPage();  // screen not full yet
}
async function load(keep) {
  if (tab === 'dl') return loadDownloads();
  const grid = $('#grid');
  paging.gen++;
  $('#filters').classList.toggle('hide', !!showId);
  if (showId) { paging.done = true; grid.innerHTML = '<div class="empty">Loading…</div>';
    const items = await api(`/shows/${showId}/episodes`); grid.innerHTML = ''; items.forEach(it => grid.appendChild(card(it))); return; }
  $('#crumb').style.display = 'none';
  // keep: reload as many items as were on screen and restore the scroll position (after Stop)
  const want = keep ? paging.offset : 0, y = scrollY;
  paging = { offset: 0, done: false, busy: false, gen: paging.gen };
  if (!keep) grid.innerHTML = '<div class="empty">Loading…</div>';
  await nextPage();
  while (keep && !paging.done && !paging.busy && paging.offset < want) await nextPage();
  if (keep) scrollTo(0, y);
}
new IntersectionObserver(es => { if (es[0].isIntersecting) nextPage(); }, { rootMargin: '600px' }).observe($('#more'));
const focusCard = key => { const c = key ? document.querySelector(`.card[data-key="${key}"]`) : document.querySelector('#grid .card'); if (c) focusEl(c); };
let showKey = null;
function leaveShow(fromHistory) {
  if (!showId) return;
  if (!fromHistory) dropLayer('show');
  showId = null; load().then(() => focusCard(showKey));
}
function openShow(s) {
  if (!showId) pushLayer('show');
  showKey = 'show' + s.id;
  showId = s.id; scrollTo(0, 0); $('#crumb').style.display = 'block'; $('#crumb').innerHTML = `<a href="#" id="back">◀ Shows</a> / ${esc(s.title)}`;
  // back to the show list: land on the show you came from
  $('#back').onclick = e => { e.preventDefault(); leaveShow(); };
  load().then(() => focusCard());
}
$('#q').oninput = () => { clearTimeout(window._t); window._t = setTimeout(() => load(), 300); };
for (const el of ['#fSort', '#fGenre', '#fUnw']) $(el).onchange = () => { savePrefs(); scrollTo(0, 0); load(); };
async function setTab(t) {
  if (showId) dropLayer('show');
  tab = t; showId = null;
  $('#tabM').classList.toggle('on', t === 'movie'); $('#tabS').classList.toggle('on', t === 'show'); $('#tabD').classList.toggle('on', t === 'dl');
  $('#crumb').style.display = 'none';
  if (t === 'dl') { paging.gen++; paging.done = true; $('#filters').classList.add('hide'); scrollTo(0, 0); return loadDownloads(); }
  await restorePrefs(); scrollTo(0, 0); return load();
}
const tvFocus = () => { if (document.documentElement.classList.contains('tv')) focusCard(); };
$('#tabM').onclick = () => setTab('movie').then(tvFocus);
$('#tabS').onclick = () => setTab('show').then(tvFocus);
$('#tabD').onclick = () => setTab('dl');

// ---------------- downloads (prepared MP4s live on the box; Save hands the file to the browser)
const gb = n => (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + ' GB';
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let dlTimer = null;
async function loadDownloads() {
  clearTimeout(dlTimer);
  if (tab !== 'dl') return;
  const r = await api('/downloads').catch(() => ({ jobs: [] }));
  if (tab !== 'dl') return;
  const grid = $('#grid'); grid.innerHTML = '';
  const box = document.createElement('div'); box.className = 'dl';
  box.innerHTML = `<div class="info" style="color:var(--mut)">Prepared MP4s stay on the box for a week. Pick a title, choose a quality, then “Prepare MP4”.` +
    (r.free_gb != null ? ` ${r.free_gb} GB free.` : '') + `</div>`;
  if (!r.jobs.length) box.innerHTML += '<div class="empty">No downloads yet</div>';
  for (const j of r.jobs) {
    const el = document.createElement('div'); el.className = 'job';
    const state = j.state === 'done' ? gb(j.size || 0) : j.state === 'running' ? `encoding ${Math.round(100 * j.progress)}%`
      : j.state === 'queued' ? (j.note || 'queued') : 'failed: ' + esc(j.error);
    el.innerHTML = `<div class="name">${esc(j.title)}<small>${esc(j.quality)} · ${state}</small></div>` +
      (j.state === 'done' ? `<a class="btn" href="${j.url}" download="${esc(j.filename)}">Save</a>` : '') +
      `<button>Delete</button>` +
      (j.state === 'running' || j.state === 'queued' ? `<div class="prog"><div style="width:${100 * j.progress}%"></div></div>` : '');
    el.querySelector('button').onclick = async () => { await post('/download/delete', { name: j.name }); loadDownloads(); };
    box.appendChild(el);
  }
  grid.appendChild(box);
  if (r.jobs.some(j => j.state === 'running' || j.state === 'queued')) dlTimer = setTimeout(loadDownloads, 3000);
}

// ---------------- track names: 'dut' -> 'Dutch', 'eng' + 'SDH' -> 'English (SDH)'
// (Matroska uses ISO 639-2/B codes; Intl.DisplayNames wants the /T forms for these)
const B2T = { ger: 'deu', dut: 'nld', fre: 'fra', chi: 'zho', cze: 'ces', gre: 'ell', baq: 'eus', rum: 'ron', may: 'msa',
  per: 'fas', arm: 'hye', alb: 'sqi', bur: 'mya', geo: 'kat', ice: 'isl', mac: 'mkd', mao: 'mri', slo: 'slk', tib: 'bod', wel: 'cym' };
let langDN = null; try { langDN = new Intl.DisplayNames(['en'], { type: 'language' }); } catch (e) {}
function langName(c) {
  c = (c || '').toLowerCase();
  if (!c || c === 'und') return 'Unknown';
  try { const n = langDN && langDN.of(B2T[c] || c); if (n && n !== 'root') return n; } catch (e) {}
  return c;
}
const trackName = (s, extra) => langName(s.lang) + (s.title ? ` (${s.title})` : '') + (extra || '');
// subtitle languages picked before, most recent first (sorted to the top of the list)
function subPrefs() { try { return JSON.parse(localStorage.getItem('ks.subLangs') || '[]') || []; } catch (e) { return []; } }
function rememberSub(lang) {
  if (!lang) return;
  try { localStorage.setItem('ks.subLangs', JSON.stringify([lang, ...subPrefs().filter(x => x !== lang)].slice(0, 5))); } catch (e) {}
}

// ---------------- detail sheet
let quality = '720p';
try { quality = localStorage.getItem('ks.quality') || quality; } catch (e) {}
$('#dQ').value = quality; if (!$('#dQ').value) $('#dQ').value = '720p';
$('#dQ').onchange = () => { quality = $('#dQ').value; try { localStorage.setItem('ks.quality', quality); } catch (e) {} };
let lastCard = null;
async function openItem(it) {
  lastCard = document.activeElement && document.activeElement.classList.contains('card') ? document.activeElement : null;
  cur = { type: it.type, id: it.id, title: it.type === 'episode' ? `${it.show} S${it.season}E${it.episode} · ${it.title}` : it.title };
  $('#dTitle').textContent = cur.title; $('#dInfo').textContent = 'Probing…'; if (!detailOn()) pushLayer('detail');
  $('#detail').classList.add('on');
  $('#dDlMsg').textContent = ''; $('#dOrig').style.display = 'none'; $('#dResume').style.display = 'none';
  $('#dPlay').focus({ preventScroll: true });
  const d = await api(`/item/${it.type}/${it.id}`);
  cur.meta = d;
  if (!d.available) { $('#dInfo').textContent = 'File not available (LaCie unplugged?)'; return; }
  const v = d.probe.video || {};

    const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
    const horiz = dir === 'right' || dir === 'left';
    const main = dir === 'right' ? dx : dir === 'left' ? -dx : dir === 'down' ? dy : -dy;
    const cross = horiz ? Math.abs(dy) : Math.abs(dx);
    if (main <= 4) continue;
    // same row (left/right) or same column (up/down) always wins; anything else must lie within
    // 45° of the direction and comes after
    const inLine = horiz ? b.top < a.bottom && b.bottom > a.top : b.left < a.right && b.right > a.left;
    // then anything within 45° of the direction, and as a last resort the nearest one that way at all
    const score = inLine ? main + cross * 0.3 : cross <= main ? 10000 + main + cross * 2 : 20000 + main + cross * 2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  focusEl(best);
}
function goBack() {
  if (!layers.length) return false;
  history.back();   // popstate closes the top layer (picker > player > detail > episode list)
  return true;
}
// "back to the titles" (blue / 416): close everything down to the grid
function backToTitles() {
  if (menuOpen()) closePicker();
  if (playerOn()) return stopPlay();
  if (detailOn()) return closeDetail();
  if (showId) return leaveShow();
  if (tab === 'dl') return setTab('movie').then(() => focusCard());
  scrollTo(0, 0); focusCard();
}
document.addEventListener('keydown', e => {
  const k = e.keyCode, dir = DIRS[k], ae = document.activeElement;
  // the picker owns the keys while open: up/down wrap, page / channel up-down jump 8 rows
  if (menuOpen()) {
    if (K.BACK.includes(k) || k === 406 || k === 416) { closePicker(); return e.preventDefault(); }
    const bs = [...$('#pmenu').querySelectorAll('button')], i = bs.indexOf(ae);
    if (K.PLAY.includes(k) || K.PLAYPAUSE.includes(k)) { if (bs.includes(ae)) ae.click(); return e.preventDefault(); }
    const step = k === 40 || K.FF.includes(k) ? 1 : k === 38 || K.REW.includes(k) ? -1 : k === 34 ? 8 : k === 33 ? -8 : 0;
    if (step && (K.FF.includes(k) || K.REW.includes(k)) && window.ksSelectMode) ksSelectMode();
    if (step) {
      let j = i < 0 ? 0 : i + step;
      j = Math.abs(step) === 1 ? (j + bs.length) % bs.length : Math.max(0, Math.min(bs.length - 1, j));
      focusEl(bs[j]); e.preventDefault();
    } else if (dir) e.preventDefault();
    if (playerOn()) showBar();
    return;
  }
  // colour buttons. The LG hotel TV only hands red (403) and yellow (405) to web pages (green / blue /
  // arrows stay with the TV), so those two carry the important jobs:
  //   red    = subtitles (player, detail)  · library: Movies <-> Shows
  //   yellow = quality   (player, detail)  · library: search
  //   green  = audio (player, detail) · library: Shows      (other TVs)
  //   blue / 416 = back to the titles
  const color = { 403: 'r', 404: 'g', 405: 'y', 406: 'b', 416: 'b' }[k];
  if (color === 'b') { e.preventDefault(); backToTitles(); return; }
  if (color) {
    e.preventDefault();
    const i = { r: 0, g: 1, y: 2 }[color];
    if (playerOn()) { showBar(); [$('#pSub'), $('#pAudio'), $('#pQ')][i].click(); }
    else if (detailOn()) [$('#dSub')._btn, $('#dAudio')._btn, $('#dQ')._btn][i].click();
    else if (color === 'y') focusEl($('#q'));
    else if (color === 'g') setTab('show').then(() => focusCard());
    else setTab(tab === 'movie' ? 'show' : 'movie').then(() => focusCard());
    return;
  }
  // outside the player the media keys browse: ⏩ / ⏪ = next / previous title (or control on the detail
  // sheet), ▶ = open what is highlighted. On pointer TVs OK then also opens the highlighted title.
  if (!playerOn() && (K.FF.includes(k) || K.REW.includes(k) || K.PLAY.includes(k) || K.PLAYPAUSE.includes(k))) {
    e.preventDefault();
    if (!window.__mediaLogged) { window.__mediaLogged = true; try { new Image().src = '/api/_diag?ev=media&kc=' + k; } catch (x) {} }
    if (K.PLAY.includes(k) || K.PLAYPAUSE.includes(k)) {
      // on a title's screen ▶ means "watch it": resume / from start as a small menu, or just start
      if (detailOn() && cur && cur.meta && cur.meta.available && !(ae && ae.classList.contains('selbtn'))) return playMenu();
      if (ae && ae !== document.body) ae.click();
      return;
    }
    const list = detailOn() ? focusables($('#detail')) : [...document.querySelectorAll('#grid .card')];
    if (!list.length) return;
    const i = list.indexOf(ae);
    focusEl(list[i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + (K.FF.includes(k) ? 1 : -1)))]);
    if (window.ksSelectMode) ksSelectMode();
    return;
  }
  // the remote's own Stop key: stop and go back to the titles (focus lands on the one that played)
  if (playerOn() && K.STOP.includes(k)) { stopPlay(); return e.preventDefault(); }
  if (playerOn()) {
    if (K.PLAY.includes(k)) { video.play(); return e.preventDefault(); }
    if (K.PAUSE.includes(k)) { video.pause(); saveProgress(); return e.preventDefault(); }
    if (K.PLAYPAUSE.includes(k)) { $('#bPlay').onclick(); return e.preventDefault(); }
    if (K.FF.includes(k)) { seekTo(absPos() + 30); showBar(); return e.preventDefault(); }
    if (K.REW.includes(k)) { seekTo(absPos() - 15); showBar(); return e.preventDefault(); }
    const hidden = $('#player').classList.contains('hidebar');
    showBar();
    // the first key on a hidden bar only brings it back (so OK can't fire an invisible button)
    if (hidden) { e.preventDefault(); e.stopPropagation(); if (!$('#pbar').contains(ae)) $('#bPlay').focus(); return; }
    // on the seek slider left/right skip like the ±buttons instead of nudging by 0.1 %
    if (ae === $('#seek') && (dir === 'left' || dir === 'right')) { seekTo(absPos() + (dir === 'right' ? 30 : -15)); return e.preventDefault(); }
  }
  if (K.BACK.includes(k) && !(k === 8 && ae && ae.tagName === 'INPUT')) { if (goBack()) e.preventDefault(); return; }
  if ((k === 33 || k === 34) && ae && ae.classList.contains('card')) { moveFocus(k === 34 ? 'down' : 'up'); return e.preventDefault(); }
  if (k === 13 && ae && ae.classList.contains('card')) { ae.click(); return e.preventDefault(); }
  if (k === 13 && ae && ae.type === 'checkbox') { ae.click(); return e.preventDefault(); }
  if (!dir) return;
  // inside the search box left/right move the cursor, and leave the box once it is at the end / start
  if (ae && ae.tagName === 'INPUT' && ae.type !== 'checkbox' && ae.type !== 'range' && (dir === 'left' || dir === 'right')) {
    const atEdge = dir === 'right' ? ae.selectionStart >= ae.value.length : ae.selectionEnd <= 0;
    if (!atEdge) return;
  }
  moveFocus(dir); e.preventDefault();
}, true);
video.onended = () => { saveProgress(); };
window.addEventListener('pagehide', () => { if ($('#player').classList.contains('on')) saveProgress(true); });
// device list / phone sign-in only exist behind the VPS login, not on the LAN site
if (/(^|\.)nellika\.io$/.test(location.hostname)) $('#acct').style.display = '';
setTab('movie').then(() => { if (document.documentElement.classList.contains('tv')) focusCard(); });
// TV browsers keep serving the page from memory (history / back-forward cache), so a deployed fix may
// never arrive: every 2 minutes, and when the page is shown again, compare this build with the server's
// and reload when it changed (never during playback or with a menu open).
const BUILD = 'tvnav-13';
async function checkBuild() {
  if (playerOn() || menuOpen() || detailOn()) return;
  try {
    const txt = await fetch('/?build=' + Date.now(), { cache: 'no-store' }).then(r => r.text());
    const m = txt.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) location.reload();
  } catch (e) {}
}
setInterval(checkBuild, 120000);
window.addEventListener('pageshow', ev => { if (ev.persisted) checkBuild(); });
</script>
