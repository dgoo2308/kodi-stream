<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodi stream</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --acc:#4da3ff; --card:#1b1b1b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:#000d; backdrop-filter:blur(8px); display:flex; gap:8px; align-items:center; padding:10px 12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 8px 0 0; }
  header input[type=search] { flex:0 1 220px; min-width:0; background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:7px 10px; font-size:15px; }
  .filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .filters select, .filters label { background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:7px 8px; font-size:14px; max-width:170px; }
  .filters label { display:flex; gap:5px; align-items:center; cursor:pointer; white-space:nowrap; }
  .filters.hide { display:none; }
  .tabs { margin-left:auto; display:flex; gap:6px; }
  .tabs button { background:#222; color:var(--fg); border:1px solid #333; border-radius:8px; padding:8px 10px; }
  .tabs .acct { background:#222; border:1px solid #333; border-radius:8px; padding:8px 10px; text-decoration:none; }
  .tabs button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  #more { height:1px; }
  /* phone: tabs + search on row 1, sort/genre/unwatched on row 2 */
  @media (max-width: 640px) {
    header { gap:6px; padding:8px 10px; }
    header h1 { display:none; }
    .tabs { order:1; margin-left:0; }
    header input[type=search] { order:2; flex:1 1 0; }
    .filters { order:3; flex:1 1 100%; flex-wrap:nowrap; min-width:0; }
    .filters select { flex:1 1 0; min-width:0; max-width:none; }
    .filters label { flex:none; padding:7px 6px; }
  }
  main { padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; }
  .card img { width:100%; aspect-ratio:2/3; object-fit:cover; background:#222; display:block; }
  .card.ep img { aspect-ratio:16/9; }
  .card .t { padding:6px 8px; font-size:13px; line-height:1.25; }
  .card .t small { color:var(--mut); display:block; }
  .card .bar { position:absolute; left:0; bottom:0; height:3px; background:var(--acc); }
  .card .seen { position:absolute; top:6px; right:6px; background:#0a0c; color:#8f8; font-size:11px; padding:2px 6px; border-radius:6px; }
  #player { position:fixed; inset:0; background:#000; z-index:10; display:none; flex-direction:column; }
  #player.on { display:flex; }
  #player video { position:absolute; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }
  #pbar { position:absolute; left:0; right:0; bottom:0; z-index:2; display:flex; gap:10px; align-items:center; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top,#000f,#0008 55%,#0000); color:#eee; font-size:13px; flex-wrap:wrap; }
  #pbar { opacity:1; transition:opacity .25s ease; }
  #player.hidebar #pbar { opacity:0; pointer-events:none; }
  #player.hidebar { cursor:none; }
  #pbar button, #pbar select { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:6px 10px; }
  #seek { flex:1; min-width:160px; }
  #ptitle { width:100%; color:#fff; font-weight:600; }
  #msg { color:#fc6; }
  #buf { color:var(--mut); }
  a.btn { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px 12px; font-size:15px; text-decoration:none; }
  .dl { grid-column:1/-1; display:flex; flex-direction:column; gap:10px; max-width:720px; }
  .dl .job { background:var(--card); border-radius:10px; padding:10px 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dl .job .name { flex:1 1 220px; min-width:0; }
  .dl .job small { color:var(--mut); display:block; }
  .dl .job .prog { flex:1 1 100%; height:4px; background:#333; border-radius:2px; overflow:hidden; }
  .dl .job .prog div { height:100%; background:var(--acc); }
  .dl .job button { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:6px 10px; }
  #detail { position:fixed; inset:auto 0 0 0; background:#181818; border-top:1px solid #333; padding:14px 16px 24px; z-index:6; display:none; }
  #detail.on { display:block; }
  #detail h2 { margin:0 0 6px; font-size:17px; }
  #detail .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  #detail button, #detail select { background:#222; color:var(--fg); border:1px solid #444; border-radius:8px; padding:8px 12px; font-size:15px; }
  #detail button.primary { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600; }
  #detail .info { color:var(--mut); font-size:13px; }
  .empty { color:var(--mut); padding:30px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Kodi</h1>
  <input id="q" type="search" placeholder="Search…" autocomplete="off">
  <div class="filters" id="filters">
    <select id="fSort" title="Sort">
      <option value="added">Recently added</option>
      <option value="title">Title A–Z</option>
      <option value="year">Newest release</option>
      <option value="rating">Top rated</option>
      <option value="watched">Recently watched</option>
    </select>
    <select id="fGenre" title="Genre"><option value="">All genres</option></select>
    <label><input type="checkbox" id="fUnw"> Unwatched</label>
  </div>
  <div class="tabs"><button id="tabM" class="on">Movies</button><button id="tabS">Shows</button><button id="tabD" title="Downloads">⬇</button><a id="acct" class="acct" href="/_devices" title="My devices / sign in a TV" style="display:none">👤</a></div>
</header>
<main><div id="crumb" style="color:var(--mut);margin:0 0 8px;display:none"></div><div id="grid" class="grid"></div><div id="more"></div></main>

<div id="detail">
  <h2 id="dTitle"></h2>
  <div class="info" id="dInfo">…</div>
  <div class="row">
    <label>Audio <select id="dAudio"></select></label>
    <label>Subtitles <select id="dSub"><option value="">none</option></select></label>
    <label>Quality <select id="dQ"><option value="720p">720p</option><option value="540p">540p</option><option value="360p">360p</option></select></label>
    <label>Encoder <select id="dEnc"><option value="x264">SW (x264)</option><option value="rkmpp">HW (rkmpp)</option></select></label>
  </div>
  <div class="row">
    <button class="primary" id="dResume" style="display:none">Resume</button>
    <button class="primary" id="dPlay">Play from start</button>
    <button id="dClose">Close</button>
  </div>
  <div class="row">
    <button id="dPrep" title="Encode a phone-friendly MP4 at the chosen quality, then save it from the ⬇ tab">⬇ Prepare MP4</button>
    <a id="dOrig" class="btn" href="#" style="display:none">⬇ Original</a>
    <span class="info" id="dDlMsg"></span>
  </div>
</div>

<div id="player">
  <video id="video" playsinline autoplay></video>
  <div id="pbar">
    <div id="ptitle"></div>
    <button id="bPlay">⏸</button>
    <span id="tcur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="tdur">0:00</span>
    <button id="bBack">−15s</button><button id="bFwd">+30s</button>
    <select id="pAudio" title="Audio" style="max-width:150px"></select>
    <select id="pSub" title="Subtitles" style="max-width:150px"></select>
    <select id="pQ" title="Quality"></select>
    <button id="bFull">⛶</button>
    <button id="bStop">Stop</button>
    <span id="msg"></span>
    <span id="buf"></span>
  </div>
</div>

<script src="hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch('/api' + p, opt).then(r => r.json());
const post = (p, body) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
let tab = 'movie', showId = null, cur = null;
{ const e = new URLSearchParams(location.search).get('enc'); if (e === 'x264' || e === 'rkmpp') setTimeout(() => { $('#dEnc').value = e; }, 0); }

// ---------------- catalogue
function card(it) {
  const d = document.createElement('div');
  d.className = 'card' + (it.type === 'episode' ? ' ep' : '');
  const pct = it.total ? Math.min(100, 100 * (it.resume||0) / it.total) : 0;
  const sub = it.type === 'episode' ? `S${it.season}E${it.episode}`
    : (it.year || '') + ($('#fSort').value === 'rating' && it.rating ? ` · ★${it.rating}` : '');
  d.innerHTML = `<img loading="lazy" src="${it.poster || ''}" alt=""><div class="t">${it.title}<small>${sub}</small></div>` +
    (pct ? `<div class="bar" style="width:${pct}%"></div>` : '') + (it.playCount ? '<div class="seen">✓</div>' : '');
  d.onclick = () => it.type === 'show' ? openShow(it) : openItem(it);
  return d;
}
// sort / genre / unwatched, remembered per tab (browser storage may be unavailable: then just defaults)
const PAGE = 120;
let paging = { offset: 0, done: true, busy: false, gen: 0 };
const genreCache = {};
function savePrefs() {
  try { localStorage.setItem('ks.filters.' + tab, JSON.stringify({ sort: $('#fSort').value, genre: $('#fGenre').value, unw: $('#fUnw').checked })); } catch (e) {}
}
async function restorePrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('ks.filters.' + tab) || '{}') || {}; } catch (e) {}
  $('#fSort').value = p.sort || 'added';
  if (!$('#fSort').value) $('#fSort').value = 'added';
  $('#fUnw').checked = !!p.unw;
  const kind = tab === 'movie' ? 'movie' : 'tvshow';
  if (!genreCache[kind]) genreCache[kind] = await api('/genres?type=' + kind).catch(() => []);
  $('#fGenre').innerHTML = '<option value="">All genres</option>' +
    genreCache[kind].map(g => `<option value="${g.name.replace(/"/g, '&quot;')}">${g.name} (${g.count})</option>`).join('');
  $('#fGenre').value = p.genre || '';
  if ($('#fGenre').value !== (p.genre || '')) $('#fGenre').value = '';
}
async function nextPage() {
  if (paging.done || paging.busy) return;
  paging.busy = true; const gen = paging.gen;
  const params = new URLSearchParams({ q: $('#q').value.trim(), sort: $('#fSort').value, genre: $('#fGenre').value,
                                       unwatched: $('#fUnw').checked ? '1' : '', limit: PAGE, offset: paging.offset });
  const items = await api(`/${tab === 'movie' ? 'movies' : 'shows'}?${params}`).catch(() => []);
  if (gen !== paging.gen) return;  // filters changed while this page was in flight
  const grid = $('#grid');
  if (paging.offset === 0) grid.innerHTML = items.length ? '' : '<div class="empty">Nothing found</div>';
  items.forEach(it => grid.appendChild(card(it)));
  paging.offset += items.length; paging.done = items.length < PAGE; paging.busy = false;
  if (!paging.done && $('#more').getBoundingClientRect().top < innerHeight + 600) return nextPage();  // screen not full yet
}
async function load(keep) {
  if (tab === 'dl') return loadDownloads();
  const grid = $('#grid');
  paging.gen++;
  $('#filters').classList.toggle('hide', !!showId);
  if (showId) { paging.done = true; grid.innerHTML = '<div class="empty">Loading…</div>';
    const items = await api(`/shows/${showId}/episodes`); grid.innerHTML = ''; items.forEach(it => grid.appendChild(card(it))); return; }
  $('#crumb').style.display = 'none';
  // keep: reload as many items as were on screen and restore the scroll position (after Stop)
  const want = keep ? paging.offset : 0, y = scrollY;
  paging = { offset: 0, done: false, busy: false, gen: paging.gen };
  if (!keep) grid.innerHTML = '<div class="empty">Loading…</div>';
  await nextPage();
  while (keep && !paging.done && !paging.busy && paging.offset < want) await nextPage();
  if (keep) scrollTo(0, y);
}
new IntersectionObserver(es => { if (es[0].isIntersecting) nextPage(); }, { rootMargin: '600px' }).observe($('#more'));
function openShow(s) { showId = s.id; scrollTo(0, 0); $('#crumb').style.display = 'block'; $('#crumb').innerHTML = `<a href="#" id="back">◀ Shows</a> / ${s.title}`; $('#back').onclick = e => { e.preventDefault(); showId = null; load(); }; load(); }
$('#q').oninput = () => { clearTimeout(window._t); window._t = setTimeout(() => load(), 300); };
for (const el of ['#fSort', '#fGenre', '#fUnw']) $(el).onchange = () => { savePrefs(); scrollTo(0, 0); load(); };
async function setTab(t) {
  tab = t; showId = null;
  $('#tabM').classList.toggle('on', t === 'movie'); $('#tabS').classList.toggle('on', t === 'show'); $('#tabD').classList.toggle('on', t === 'dl');
  $('#crumb').style.display = 'none';
  if (t === 'dl') { paging.gen++; paging.done = true; $('#filters').classList.add('hide'); scrollTo(0, 0); return loadDownloads(); }
  await restorePrefs(); scrollTo(0, 0); load();
}
$('#tabM').onclick = () => setTab('movie');
$('#tabS').onclick = () => setTab('show');
$('#tabD').onclick = () => setTab('dl');

// ---------------- downloads (prepared MP4s live on the box; Save hands the file to the browser)
const gb = n => (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + ' GB';
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let dlTimer = null;
async function loadDownloads() {
  clearTimeout(dlTimer);
  if (tab !== 'dl') return;
  const r = await api('/downloads').catch(() => ({ jobs: [] }));
  if (tab !== 'dl') return;
  const grid = $('#grid'); grid.innerHTML = '';
  const box = document.createElement('div'); box.className = 'dl';
  box.innerHTML = `<div class="info" style="color:var(--mut)">Prepared MP4s stay on the box for a week. Pick a title, choose a quality, then “Prepare MP4”.` +
    (r.free_gb != null ? ` ${r.free_gb} GB free.` : '') + `</div>`;
  if (!r.jobs.length) box.innerHTML += '<div class="empty">No downloads yet</div>';
  for (const j of r.jobs) {
    const el = document.createElement('div'); el.className = 'job';
    const state = j.state === 'done' ? gb(j.size || 0) : j.state === 'running' ? `encoding ${Math.round(100 * j.progress)}%`
      : j.state === 'queued' ? (j.note || 'queued') : 'failed: ' + esc(j.error);
    el.innerHTML = `<div class="name">${esc(j.title)}<small>${esc(j.quality)} · ${state}</small></div>` +
      (j.state === 'done' ? `<a class="btn" href="${j.url}" download="${esc(j.filename)}">Save</a>` : '') +
      `<button>Delete</button>` +
      (j.state === 'running' || j.state === 'queued' ? `<div class="prog"><div style="width:${100 * j.progress}%"></div></div>` : '');
    el.querySelector('button').onclick = async () => { await post('/download/delete', { name: j.name }); loadDownloads(); };
    box.appendChild(el);
  }
  grid.appendChild(box);
  if (r.jobs.some(j => j.state === 'running' || j.state === 'queued')) dlTimer = setTimeout(loadDownloads, 3000);
}

// ---------------- detail sheet
let quality = '720p';
try { quality = localStorage.getItem('ks.quality') || quality; } catch (e) {}
$('#dQ').value = quality; if (!$('#dQ').value) $('#dQ').value = '720p';
$('#dQ').onchange = () => { quality = $('#dQ').value; try { localStorage.setItem('ks.quality', quality); } catch (e) {} };
async function openItem(it) {
  cur = { type: it.type, id: it.id, title: it.type === 'episode' ? `${it.show} S${it.season}E${it.episode} · ${it.title}` : it.title };
  $('#dTitle').textContent = cur.title; $('#dInfo').textContent = 'Probing…'; $('#detail').classList.add('on');
  $('#dDlMsg').textContent = ''; $('#dOrig').style.display = 'none';
  const d = await api(`/item/${it.type}/${it.id}`);
  cur.meta = d;
  if (!d.available) { $('#dInfo').textContent = 'File not available (LaCie unplugged?)'; return; }
  const v = d.probe.video || {};
  $('#dInfo').textContent = `${v.codec} ${v.width}×${v.height} ${v.pix_fmt} · ${fmt(d.probe.duration)} · ${(d.probe.bit_rate/1e6).toFixed(1)} Mbps` + (d.resume ? ` · resume at ${fmt(d.resume)}` : '');
  const a = $('#dAudio'); a.innerHTML = '';
  d.probe.audio.forEach(s => { const o = document.createElement('option'); o.value = s.index; o.textContent = `${s.lang||'?'} ${s.codec} ${s.channels||''}ch ${s.title||''}`; a.appendChild(o); });
  const eng = d.probe.audio.find(s => s.lang === 'eng'); if (eng) a.value = eng.index;
  const sb = $('#dSub'); sb.innerHTML = '<option value="">none</option>';
  d.probe.subs.filter(s => s.text).forEach(s => { const o = document.createElement('option'); o.value = s.path ? 'ext:' + s.path : s.index; o.textContent = `${s.lang||'?'} ${s.codec}${s.path ? ' (file)' : ''} ${s.title||''}`; sb.appendChild(o); });
  $('#dResume').style.display = d.resume > 0 ? '' : 'none';
  $('#dResume').textContent = `Resume ${fmt(d.resume)}`;
  $('#dOrig').href = `/api/download/original/${it.type}/${it.id}`;
  $('#dOrig').textContent = `⬇ Original (${gb(d.size || 0)})`; $('#dOrig').style.display = '';
}
$('#dClose').onclick = () => $('#detail').classList.remove('on');
$('#dPlay').onclick = () => startPlay(0);
$('#dResume').onclick = () => startPlay(cur.meta.resume);
$('#dPrep').onclick = async () => {
  if (!cur || !cur.meta || !cur.meta.available) return;
  const audio = $('#dAudio').value === '' ? null : Number($('#dAudio').value);
  const r = await post('/download', { type: cur.type, id: cur.id, quality: $('#dQ').value, audio, sub: $('#dSub').value || null });
  $('#dDlMsg').textContent = r.error ? r.error : r.state === 'done' ? 'Ready in the ⬇ tab' : 'Queued, progress in the ⬇ tab';
};

// ---------------- player
// Sessions are EVENT playlists: the box keeps every segment it made until Stop and encodes ahead
// of playback, so pausing never loses the place and seeks inside the produced range need no restart.
const video = $('#video'); let hls = null, offset = 0, duration = 0, mode = '', ticker = null, lastSave = 0, sess = null, sessAt = 0;
function absPos() { return offset + (video.currentTime || 0); }
function playBody(at) {
  const audio = $('#dAudio').value === '' ? null : Number($('#dAudio').value);
  return { type: cur.type, id: cur.id, offset: at, audio, sub: $('#dSub').value || null, enc: $('#dEnc').value, quality: $('#dQ').value };
}
async function startPlay(at) {
  $('#detail').classList.remove('on'); $('#player').classList.add('on'); $('#ptitle').textContent = cur.title; $('#msg').textContent = 'Starting…';
  const res = await post('/play', playBody(at));
  if (res.error) { $('#msg').textContent = res.error; return; }
  mode = res.mode; duration = res.duration || cur.meta.probe.duration; offset = res.offset || 0; sess = res;
  $('#tdur').textContent = fmt(duration); $('#msg').textContent = '';
  syncPlayerSubs();
  attach(res.url, at);
  clearInterval(ticker); ticker = setInterval(tick, 1000);
}
function attach(url, at) {
  if (hls) { hls.destroy(); hls = null; }
  if (mode === 'direct') { video.src = url; video.currentTime = at || 0; video.play().catch(()=>{}); return; }
  const start = () => {
    if (!(window.Hls && Hls.isSupported())) {  // iOS Safari: no MSE, native HLS
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari starts an unfinished (EVENT) playlist near its end; begin at the session start instead
        video.addEventListener('loadedmetadata', () => { if (video.currentTime > 1) video.currentTime = 0; }, { once: true });
        video.src = url; video.play().catch(()=>{});
      }
      else $('#msg').textContent = 'HLS not supported by this browser';
      return;
    }
    // startPosition 0 + no live-latency limits: never chase the "live edge" (that was the jump after
    // a pause); buffer generously so a weak connection rides out dips
    hls = new Hls({ startPosition: 0, maxBufferLength: 120, maxMaxBufferLength: 600, backBufferLength: 120,
                    maxBufferSize: 200 * 1000 * 1000, enableWorker: true });
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); if (hls.subtitleTracks.length) hls.subtitleTrack = 0; });
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { $('#msg').textContent = 'stream error: ' + d.type; if (d.type === 'networkError') setTimeout(() => hls && hls.startLoad(), 1500); } });
  };
  // wait for the master playlist to exist
  (async function poll(n) {
    const s = await api('/session');
    if (s.ready) { sess = s; sessAt = Date.now(); return start(); }
    if (!s.alive) { $('#msg').textContent = 'encoder stopped: ' + (s.error || 'see log'); return; }
    if (n < 40) setTimeout(() => poll(n+1), 500); else $('#msg').textContent = 'timeout waiting for stream';
  })(0);
}
function bufferedAhead() {
  const b = video.buffered, t = video.currentTime;
  for (let i = 0; i < b.length; i++) if (b.start(i) <= t + 0.5 && t <= b.end(i)) return b.end(i) - t;
  return 0;
}
function tick() {
  if (!$('#player').classList.contains('on')) return;
  const pos = absPos(); $('#tcur').textContent = fmt(pos);
  if (duration && !$('#seek').dragging) $('#seek').value = Math.round(1000 * pos / duration);
  if (Date.now() - lastSave > 30000 && !video.paused) saveProgress();
  if (mode !== 'direct' && sess && sess.session && Date.now() - sessAt > 5000) {
    sessAt = Date.now();
    api('/session').then(s => { if (sess && s.session === sess.session) sess = s; }).catch(() => {});
  }
  // how far ahead this device has buffered, and how far the box has encoded
  const made = mode !== 'direct' && sess && sess.produced != null
    ? (sess.complete ? ' · box: done' : ` · box: +${fmt(Math.max(0, sess.produced - pos))}`) : '';
  $('#buf').textContent = `buffered ${fmt(bufferedAhead())}${made}`;
}
function saveProgress(beacon) {
  lastSave = Date.now(); const body = JSON.stringify({ type: cur.type, id: cur.id, position: absPos(), duration });
  if (beacon && navigator.sendBeacon) navigator.sendBeacon('/api/progress', new Blob([body], {type:'application/json'}));
  else fetch('/api/progress', { method:'POST', headers:{'Content-Type':'application/json'}, body });
}
async function seekTo(t, restart) {
  t = Math.max(0, Math.min(duration - 5, t));
  if (mode === 'direct') { video.currentTime = t; return; }
  // inside what this session has already produced: plain player seek, no new encode
  if (!restart && sess && t >= offset && t <= (sess.complete ? duration : (sess.produced || 0) - 4)) {
    video.currentTime = t - offset; return;
  }
  $('#msg').textContent = 'seeking…'; saveProgress();
  const res = await post('/play', playBody(t));
  if (res.error) { $('#msg').textContent = res.error; return; }
  offset = res.offset; sess = res; $('#msg').textContent = ''; attach(res.url, t);
}
$('#seek').oninput = e => { e.target.dragging = true; $('#tcur').textContent = fmt(duration * e.target.value / 1000); };
$('#seek').onchange = e => { e.target.dragging = false; seekTo(duration * e.target.value / 1000); };
$('#bBack').onclick = () => seekTo(absPos() - 15);
$('#bFwd').onclick = () => seekTo(absPos() + 30);
$('#bPlay').onclick = () => { if (video.paused) video.play(); else { video.pause(); saveProgress(); } };
video.onplay = () => $('#bPlay').textContent = '⏸'; video.onpause = () => $('#bPlay').textContent = '▶';
$('#bFull').onclick = () => { const el = $('#player'); (el.requestFullscreen || el.webkitRequestFullscreen || video.webkitEnterFullscreen || (()=>{})).call(el.requestFullscreen ? el : video); };
$('#bStop').onclick = stopPlay;
async function stopPlay() {
  saveProgress(); clearInterval(ticker); if (hls) { hls.destroy(); hls = null; } video.pause(); video.removeAttribute('src'); video.load();
  sess = null; $('#player').classList.remove('on'); await post('/stop', {}); load(!showId);
}

// auto-hide the control bar during playback; show on mouse move / tap / pause
let barTimer;
function showBar() {
  const pl = $('#player'); pl.classList.remove('hidebar');
  clearTimeout(barTimer);
  barTimer = setTimeout(() => { if (!video.paused) pl.classList.add('hidebar'); }, 3000);
}
$('#player').addEventListener('mousemove', showBar);
$('#player').addEventListener('touchstart', showBar, { passive: true });
$('#player').addEventListener('click', showBar);
video.addEventListener('pause', () => { clearTimeout(barTimer); $('#player').classList.remove('hidebar'); });
video.addEventListener('play', showBar);

// in-player audio / subtitle / quality pickers: mirror the detail sheet, switch by restarting at the current position
function syncPlayerSubs() {
  for (const [pid, did] of [['#pAudio', '#dAudio'], ['#pSub', '#dSub'], ['#pQ', '#dQ']]) {
    const p = $(pid), d = $(did);
    p.innerHTML = d.innerHTML; p.value = d.value;
    p.style.display = p.options.length > 1 ? '' : 'none';
  }
}
$('#pAudio').onchange = () => { $('#dAudio').value = $('#pAudio').value; seekTo(absPos(), true); };
$('#pSub').onchange = () => { $('#dSub').value = $('#pSub').value; seekTo(absPos(), true); };
$('#pQ').onchange = () => { $('#dQ').value = $('#pQ').value; $('#dQ').onchange(); seekTo(absPos(), true); };
video.onended = () => { saveProgress(); };
window.addEventListener('pagehide', () => { if ($('#player').classList.contains('on')) saveProgress(true); });
// device list / phone sign-in only exist behind the VPS login, not on the LAN site
if (/(^|\.)nellika\.io$/.test(location.hostname)) $('#acct').style.display = '';
setTab('movie');
</script>
